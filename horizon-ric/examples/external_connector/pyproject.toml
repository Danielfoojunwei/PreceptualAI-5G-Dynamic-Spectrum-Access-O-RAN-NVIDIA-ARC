[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-ric-random-telemetry"
version = "0.1.0"
description = "Example external connector: synthetic-event Source for PreceptualAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
]

[project.entry-points."horizon_ric.connectors"]
random_telemetry = "random_telemetry:RandomTelemetrySource"

[tool.setuptools.packages.find]
where = ["."]
include = ["random_telemetry*"]
