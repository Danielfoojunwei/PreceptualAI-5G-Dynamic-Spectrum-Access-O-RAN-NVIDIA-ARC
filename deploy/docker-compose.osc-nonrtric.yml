# OSC NONRTRIC reference stack — pinned to the real release-registry
# digests retrieved live from `nexus3.o-ran-sc.org:10002/v2/<image>/manifests/<tag>`.
# Operator instructions for bringing this up on a host with docker
# group access are in deploy/OSC_NONRTRIC_PROOF.md.
#
# Image digests (verified via the registry HTTP manifest endpoint):
#   o-ran-sc/nonrtric-plt-a1policymanagementservice:2.11.0
#     -> sha256:0c377868cdde4e93c2d936295579a57f18bc66bbec1cf4212443f9329c1a7611
#   o-ran-sc/nonrtric-plt-rappcatalogue:1.2.0
#     -> sha256:2b65f41882aea374f9a295da54db5a71f5e753c528ee492e47d7932a988381a2
#   o-ran-sc/nonrtric-plt-informationcoordinatorservice:1.6.1
#     -> sha256:531eb929b9ee7b28fda5ffd17ed72f0c0d9c6466823c1223040fdae9c40795b6
#
# TLS is disabled in this dev compose. The proof file states this
# explicitly. Production deploys MUST front the services with mTLS
# per O-RAN.WG11.

services:

  a1pms:
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/nonrtric-plt-a1policymanagementservice@sha256:0c377868cdde4e93c2d936295579a57f18bc66bbec1cf4212443f9329c1a7611
    container_name: horizon-a1pms
    ports:
      - "8081:8081"  # plain HTTP (TLS disabled in dev)
      - "8433:8433"  # HTTPS, unused here
    environment:
      - APP_PROFILE=
    volumes:
      - ./osc_specs/application_configuration.json:/opt/app/policy-agent/data/application_configuration.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rappcatalogue:
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/nonrtric-plt-rappcatalogue@sha256:2b65f41882aea374f9a295da54db5a71f5e753c528ee492e47d7932a988381a2
    container_name: horizon-rappcatalogue
    ports:
      - "8680:8680"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8680/services || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  informationcoordinatorservice:
    image: nexus3.o-ran-sc.org:10002/o-ran-sc/nonrtric-plt-informationcoordinatorservice@sha256:531eb929b9ee7b28fda5ffd17ed72f0c0d9c6466823c1223040fdae9c40795b6
    container_name: horizon-ics
    ports:
      - "8083:8083"
      - "8434:8434"
    environment:
      - APP_PROFILE=
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Sidecar that runs the PreceptualAI rApp end-to-end pipeline against
  # the live OSC services. Image is built from the project root via
  # `docker build -t horizon-rapp:dev -f deploy/docker/Dockerfile.rapp .`.
  horizon-rapp:
    image: horizon-rapp:dev
    container_name: horizon-rapp
    depends_on:
      a1pms:
        condition: service_healthy
      rappcatalogue:
        condition: service_healthy
    environment:
      - HORIZON_OSC_LIVE=1
      - HORIZON_OSC_A1PMS_URL=http://a1pms:8081
      - HORIZON_OSC_RAPPCAT_URL=http://rappcatalogue:8680
      - HORIZON_OSC_ICS_URL=http://informationcoordinatorservice:8083
    volumes:
      - ./..:/workspace:ro
    command:
      - python
      - /workspace/scripts/e2e_simulation.py
      - --osc-live
    restart: "no"
