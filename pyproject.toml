[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preceptualai"
version = "0.2.0"
description = "PreceptualAI — AI-Native Dynamic Spectrum Management xApp with UHCI for O-RAN on NVIDIA ARC"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.3",
    "gymnasium>=0.29.1",
    "pydantic>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "onnxscript>=0.6",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "structlog>=23.0",
    "prometheus-client>=0.19",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "sgp4>=2.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "types-PyYAML>=6.0",
]
gpu = [
    "onnxruntime-gpu>=1.16",
]
oran = [
    "ricxappframe>=3.0",
    "mdclogpy>=1.1",
]
uhci = [
    "torch-geometric>=2.4.0",
    "torch-scatter>=2.1.0",
    "torch-sparse>=0.6.0",
]
benchmarks = [
    "stable-baselines3>=2.2.1",
    "sb3-contrib>=2.2.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = [
    "benchmarks",
    "scripts",
    "src/preceptualai/agent/sac_ltc_gpu.py",
    "src/preceptualai/core/__init__.py",
    "src/preceptualai/core/curriculum.py",
    "src/preceptualai/core/diffusion_augment.py",
    "src/preceptualai/core/fno_surrogate.py",
    "src/preceptualai/core/gnn_encoder.py",
    "src/preceptualai/core/hetero_gnn_encoder.py",
    "src/preceptualai/core/hybrid_actor.py",
    "src/preceptualai/core/kan_actor.py",
    "src/preceptualai/core/ltc_cell_cfc.py",
    "src/preceptualai/core/ltc_cell_diffeq.py",
    "src/preceptualai/core/ltc_cell_multiscale.py",
    "src/preceptualai/core/ltc_encoder_diffeq.py",
    "src/preceptualai/core/ltc_encoder_gpu.py",
    "src/preceptualai/core/mamba_encoder.py",
    "src/preceptualai/core/prioritized_replay.py",
    "src/preceptualai/core/replay_buffer_gpu.py",
    "src/preceptualai/core/smooth_actor.py",
    "src/preceptualai/core/universal_spectrum_agent.py",
    "src/preceptualai/core/world_model.py",
    "src/preceptualai/env/aodt.py",
    "src/preceptualai/env/data_pipeline.py",
    "src/preceptualai/env/fr3_propagation.py",
    "src/preceptualai/env/isac_env.py",
    "src/preceptualai/env/itu_propagation.py",
    "src/preceptualai/env/oran.py",
    "src/preceptualai/env/orbital_dynamics.py",
    "src/preceptualai/env/real_5g.py",
    "src/preceptualai/env/satellite.py",
    "src/preceptualai/env/sim_vectorized.py",
    "src/preceptualai/env/sim_vectorized_sionna.py",
    "src/preceptualai/env/sim_vectorized_warp.py",
    "src/preceptualai/env/sionna_channel.py",
    "src/preceptualai/env/unified_connectivity_env.py",
    "src/preceptualai/export/tensorrt_export.py",
    "src/preceptualai/xapp",
    "tests/test_gpu_innovations.py",
    "tests/test_paradigm_shifts.py",
    "tests/test_real_data_uhci.py",
    "tests/test_real_integration.py",
    "tests/test_uhci.py",
    "tests/test_uhci_phase3.py",
    "tests/test_uhci_phase4.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/preceptualai/__init__.py" = ["I001"]
"src/preceptualai/env/__init__.py" = ["I001"]
"src/preceptualai/proto/*_pb2*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["import-untyped"]
exclude = '''(?x)(
    ^src/preceptualai/agent/sac_ltc_gpu\.py$
  | ^src/preceptualai/core/curriculum\.py$
  | ^src/preceptualai/core/diffusion_augment\.py$
  | ^src/preceptualai/core/fno_surrogate\.py$
  | ^src/preceptualai/core/gnn_encoder\.py$
  | ^src/preceptualai/core/hetero_gnn_encoder\.py$
  | ^src/preceptualai/core/hybrid_actor\.py$
  | ^src/preceptualai/core/kan_actor\.py$
  | ^src/preceptualai/core/ltc_cell_cfc\.py$
  | ^src/preceptualai/core/ltc_cell_diffeq\.py$
  | ^src/preceptualai/core/ltc_cell_multiscale\.py$
  | ^src/preceptualai/core/ltc_encoder_diffeq\.py$
  | ^src/preceptualai/core/ltc_encoder_gpu\.py$
  | ^src/preceptualai/core/mamba_encoder\.py$
  | ^src/preceptualai/core/prioritized_replay\.py$
  | ^src/preceptualai/core/replay_buffer_gpu\.py$
  | ^src/preceptualai/core/smooth_actor\.py$
  | ^src/preceptualai/core/universal_spectrum_agent\.py$
  | ^src/preceptualai/core/world_model\.py$
  | ^src/preceptualai/env/aodt\.py$
  | ^src/preceptualai/env/data_pipeline\.py$
  | ^src/preceptualai/env/fr3_propagation\.py$
  | ^src/preceptualai/env/isac_env\.py$
  | ^src/preceptualai/env/itu_propagation\.py$
  | ^src/preceptualai/env/oran\.py$
  | ^src/preceptualai/env/orbital_dynamics\.py$
  | ^src/preceptualai/env/real_5g\.py$
  | ^src/preceptualai/env/satellite\.py$
  | ^src/preceptualai/env/sim_vectorized\.py$
  | ^src/preceptualai/env/sim_vectorized_sionna\.py$
  | ^src/preceptualai/env/sim_vectorized_warp\.py$
  | ^src/preceptualai/env/sionna_channel\.py$
  | ^src/preceptualai/env/unified_connectivity_env\.py$
  | ^src/preceptualai/export/tensorrt_export\.py$
  | ^src/preceptualai/xapp/.*\.py$
)$'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
