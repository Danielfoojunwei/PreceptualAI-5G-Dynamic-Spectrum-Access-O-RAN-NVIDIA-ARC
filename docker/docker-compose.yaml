# PreceptualAI Local Development Stack
# ---------------------------------------------------------------------------
# Brings up the full development environment:
#   - preceptualai-server:  gRPC inference server
#   - preceptualai-dev:     Development shell (optional)
#   - prometheus:       Metrics collection
#   - grafana:          Dashboards
#
# Usage:
#   docker compose -f docker/docker-compose.yaml up -d
#   docker compose -f docker/docker-compose.yaml exec dev bash
#   docker compose -f docker/docker-compose.yaml down
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # PreceptualAI gRPC inference server
  # -------------------------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: preceptualai:latest
    container_name: preceptualai-server
    ports:
      - "50051:50051"   # gRPC
      - "9090:9090"     # Prometheus metrics
    volumes:
      - ../models:/app/models:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - PRECEPTUALAI_LOG_LEVEL=INFO
      - PRECEPTUALAI_LOG_FORMAT=json
      - RMR_SEED_RT=/app/routes.rt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - preceptualai-net

  # -------------------------------------------------------------------------
  # Development shell
  # -------------------------------------------------------------------------
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: preceptualai-dev:latest
    container_name: preceptualai-dev
    stdin_open: true
    tty: true
    volumes:
      - ..:/app
    ports:
      - "8888:8888"     # Jupyter (optional)
    environment:
      - PRECEPTUALAI_LOG_LEVEL=DEBUG
      - PRECEPTUALAI_LOG_FORMAT=console
    depends_on:
      - server
    networks:
      - preceptualai-net
    profiles:
      - dev

  # -------------------------------------------------------------------------
  # Prometheus
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: preceptualai-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - preceptualai-net

  # -------------------------------------------------------------------------
  # Grafana
  # -------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: preceptualai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=preceptualai
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - preceptualai-net

# ---------------------------------------------------------------------------
# Shared resources
# ---------------------------------------------------------------------------
volumes:
  prometheus-data:
  grafana-data:

networks:
  preceptualai-net:
    driver: bridge
