# 5 default SLAs seeded into data/horizon_sla.db on first boot.
#
# Run:    horizon-sla seed-defaults  (or `horizon-sla create --file <path>`)
#
# All metric names are 3GPP TS 28.554 §6 KPIs or rApp-internal indicators
# documented in docs/SLA.md.
slas:
  - id: sla-latency-p99
    name: "TS 28.554 §6.3 user-plane latency p99"
    description: >
      User-plane delay (p99) must stay at or below 10 ms over a 5-minute
      sliding window. Maps to TS 28.554 §6.3.1 KPI.
    scope:
      tenant: "default"
      kpi: "ts28554_6_3_1"
    targets:
      - metric: latency_p99_ms
        comparison: "<="
        threshold: 10.0
        window_s: 300
    severity_levels:
      critical:
        metrics: [latency_p99_ms]

  - id: sla-a1-emit-success
    name: "A1 policy emit success rate ≥ 99.99% (24h)"
    description: >
      Fraction of A1 policy emissions that the Near-RT RIC accepted
      (PolicyStatus = ENFORCED) over a rolling 24h window.
    scope:
      tenant: "default"
    targets:
      - metric: availability_pct
        comparison: ">="
        threshold: 99.99
        window_s: 86400
    severity_levels:
      warning:
        metrics: [availability_pct]

  - id: sla-audit-chain-integrity
    name: "Audit chain integrity (verify() == -1 every check)"
    description: >
      The evidence-store hash chain must verify on every periodic check;
      a single corrupted record fires this SLA immediately.
    scope:
      tenant: "default"
    targets:
      - metric: availability_pct
        comparison: ">="
        threshold: 100.0
        window_s: 0
    severity_levels:
      critical:
        metrics: [availability_pct]

  - id: sla-epfd-margin
    name: "EPFD margin to ITU-R BO.1444 floor ≥ 5 dB"
    description: >
      Instantaneous gateway PFD margin to the regulatory floor must
      remain ≥ 5 dB. Used by maritime/NTN coexistence guards.
    scope:
      tenant: "default"
      kpi: "epfd_margin_dB"
    targets:
      - metric: epfd_margin_dB
        comparison: ">="
        threshold: 5.0
        window_s: 0
    severity_levels:
      critical:
        metrics: [epfd_margin_dB]

  - id: sla-decision-latency-p99
    name: "rApp decision-loop latency p99 ≤ 100 ms"
    description: >
      End-to-end policy-decision latency (encoder → planner → constraint
      layer → A1 emit) p99 over a 5-minute sliding window.
    scope:
      tenant: "default"
    targets:
      - metric: latency_p99_ms
        comparison: "<="
        threshold: 100.0
        window_s: 300
    severity_levels:
      warning:
        metrics: [latency_p99_ms]
