# ============================================================
# SAC-LTC Benchmarking Configuration
# NeurIPS / ICLR reproducibility standard
# ============================================================

# Global settings
global:
  device: "auto"                  # "cpu", "cuda", or "auto"
  output_dir: "benchmark_results"
  training_steps: 50_000          # total env steps per run
  eval_episodes: 100              # episodes for final evaluation
  log_interval: 500               # steps between console logs
  eval_interval: 5000             # steps between periodic evals
  save_checkpoints: true

# Random seeds — 5 seeds as per NeurIPS reproducibility checklist
seeds: [1, 2, 3, 4, 5]

# Environment parameters
environment:
  num_channels: 10
  sequence_length: 16
  num_features: 3
  pu_on_prob: 0.3
  pu_off_prob: 0.5
  noise_std: 0.1
  max_steps: 200

# Agent configurations — matched hyperparameters for fair comparison
agents:
  # Proposed method
  sac_ltc:
    class: "sac_ltc"
    params:
      hidden_dim: 128
      latent_dim: 128
      num_layers: 2
      dt: 1.0
      lr: 3.0e-4
      gamma: 0.99
      tau: 0.005
      buffer_size: 100_000
      batch_size: 256
      learning_starts: 1000

  # Baseline: attention-based (LFM)
  sac_lfm:
    class: "sac_lfm"
    params:
      model_dim: 128
      latent_dim: 128
      num_blocks: 3
      num_heads: 4
      lr: 3.0e-4
      gamma: 0.99
      tau: 0.005
      buffer_size: 100_000
      batch_size: 256
      learning_starts: 1000

  # Baseline: recurrent (LSTM)
  sac_lstm:
    class: "sac_lstm"
    params:
      hidden_dim: 128
      latent_dim: 128
      num_layers: 2
      lr: 3.0e-4
      gamma: 0.99
      tau: 0.005
      buffer_size: 100_000
      batch_size: 256
      learning_starts: 1000

  # Baseline: on-policy (PPO-LSTM)
  ppo_lstm:
    class: "ppo_lstm"
    params:
      lstm_hidden_size: 128
      n_lstm_layers: 1
      lr: 3.0e-4
      n_steps: 2048
      batch_size: 128
      n_epochs: 10
      gamma: 0.99
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.01

  # ── Traditional baselines (no training required) ────────────────────
  random:
    class: "random"
    params: {}
  round_robin:
    class: "round_robin"
    params: {}
  greedy_sinr:
    class: "greedy_sinr"
    params: {}
  epsilon_greedy:
    class: "epsilon_greedy"
    params:
      epsilon: 0.1
  tdma:
    class: "tdma"
    params: {}
  fdma:
    class: "fdma"
    params:
      fixed_channel: 0
  proportional_fair:
    class: "proportional_fair"
    params: {}
  thompson_sampling:
    class: "thompson_sampling"
    params: {}
  ucb:
    class: "ucb"
    params:
      c: 1.414
  whittle_index:
    class: "whittle_index"
    params:
      pu_on_prob: 0.3
      pu_off_prob: 0.5
  boltzmann:
    class: "boltzmann"
    params:
      temperature: 0.5
  wifi7_mlo:
    class: "wifi7_mlo"
    params: {}
  ofdma:
    class: "ofdma"
    params: {}
  carrier_aggregation:
    class: "carrier_aggregation"
    params:
      k_candidates: 3

# Agent categories for reporting
agent_categories:
  rl_agents: [sac_ltc, sac_lfm, sac_lstm, ppo_lstm]
  traditional_fixed: [random, round_robin, tdma, fdma]
  traditional_heuristic: [greedy_sinr, epsilon_greedy, proportional_fair]
  traditional_bandit: [thompson_sampling, ucb, boltzmann]
  traditional_model_based: [whittle_index]
  traditional_standard_inspired: [wifi7_mlo, ofdma, carrier_aggregation]
