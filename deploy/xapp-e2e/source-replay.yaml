# Telemetry source config for the xApp E2E proof: replays the committed
# 12-event dataset (risk bands 0.05–0.85 exercise all three policy-type
# branches of the risk planner) and audits to a scratch evidence chain.

source:
  type: file
  path: examples/replay_telemetry.jsonl

sink:
  audit_path: ./data/e2e/audit.jsonl

health:
  port: 8081

metrics:
  port: 8082

state:
  checkpoint_path: ./data/e2e/state.json
  interval_seconds: 30
