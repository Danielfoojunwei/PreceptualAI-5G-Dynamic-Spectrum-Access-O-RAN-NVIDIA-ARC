{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "horizon-ric.secretName" . }}
  labels:
    {{- include "horizon-ric.labels" . | nindent 4 }}
type: Opaque
data:
  # SPACE_TRACK_* are reserved for the planned Space-Track TLE connector —
  # no current rApp code path consumes them (see values.yaml).
  SPACE_TRACK_IDENTITY: {{ .Values.secret.data.spaceTrackIdentity | b64enc | quote }}
  SPACE_TRACK_PASSWORD: {{ .Values.secret.data.spaceTrackPassword | b64enc | quote }}
  A1_CLIENT_TOKEN: {{ .Values.secret.data.a1ClientToken | b64enc | quote }}
  {{- with .Values.secret.data.a1OauthClientSecret }}
  HORIZON_A1_OAUTH_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secret.data.apiJwtSecret }}
  HORIZON_API_JWT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
