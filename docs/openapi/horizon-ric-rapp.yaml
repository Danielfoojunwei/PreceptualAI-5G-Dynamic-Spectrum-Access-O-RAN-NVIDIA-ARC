# Horizon-RIC operator dashboard API — OpenAPI artifact.
#
# PROVENANCE: generated from `horizon_ric.rapp.dashboard_api:build_dashboard_api`,
# the surface actually served by `HorizonRAppLifecycle._serve_api()` on port 8083.
# (Earlier revisions of this file were generated from the seeded SDK/demo module
# `horizon_ric.rapp.api_v1` — see docs/API_SURFACES.md for the module map.)
#
# Regenerate with:
#   python - <<'EOF'
#   import os, yaml
#   os.environ.setdefault("HORIZON_API_JWT_SECRET", "spec-generation-only")
#   os.environ.setdefault("HORIZON_EVIDENCE_PATH", "/tmp/spec-audit.jsonl")
#   from horizon_ric.rapp.dashboard_api import build_dashboard_api
#   print(yaml.safe_dump(build_dashboard_api(lifecycle=None).openapi(), sort_keys=False))
#   EOF
openapi: 3.1.0
info:
  title: Horizon-RIC Operator Dashboard API
  description: Operator-facing REST surface for the Horizon-RIC dashboard. Every endpoint
    (except /api/v1/auth/token) requires a JWT bearer token (HS256) with a `role`
    claim. Read endpoints accept any authenticated role; POST /api/v1/audit/verify
    requires role `admin` or `operator` (403 otherwise). See README at frontend/ for
    usage.
  version: 0.2.0
paths:
  /api/v1/auth/token:
    post:
      tags:
      - auth
      summary: Auth Token
      operationId: auth_token_api_v1_auth_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/state:
    get:
      tags:
      - lifecycle
      summary: State Endpoint
      operationId: state_endpoint_api_v1_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
      security:
      - HTTPBearer: []
  /api/v1/policies:
    get:
      tags:
      - policies
      summary: Policies
      operationId: policies_api_v1_policies_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/policies/{decision_id}:
    get:
      tags:
      - policies
      summary: Policy Detail
      operationId: policy_detail_api_v1_policies__decision_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit/verify:
    post:
      tags:
      - audit
      summary: Audit Verify
      operationId: audit_verify_api_v1_audit_verify_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
      security:
      - HTTPBearer: []
  /api/v1/sla/timeline:
    get:
      tags:
      - sla
      summary: Sla Timeline
      operationId: sla_timeline_api_v1_sla_timeline_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaTimelineResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/circuit-breakers:
    get:
      tags:
      - lifecycle
      summary: Circuit Breakers
      operationId: circuit_breakers_api_v1_circuit_breakers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerListResponse'
      security:
      - HTTPBearer: []
  /api/v1/connectors:
    get:
      tags:
      - lifecycle
      summary: Connectors
      operationId: connectors_api_v1_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorListResponse'
      security:
      - HTTPBearer: []
components:
  schemas:
    AuditVerifyResponse:
      properties:
        intact:
          type: boolean
          title: Intact
        broken_at_index:
          type: integer
          title: Broken At Index
        chain_length:
          type: integer
          title: Chain Length
        head_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Head Hash
      type: object
      required:
      - intact
      - broken_at_index
      - chain_length
      - head_hash
      title: AuditVerifyResponse
    CircuitBreakerListResponse:
      properties:
        breakers:
          items:
            $ref: '#/components/schemas/CircuitBreakerState'
          type: array
          title: Breakers
      type: object
      required:
      - breakers
      title: CircuitBreakerListResponse
    CircuitBreakerState:
      properties:
        name:
          type: string
          title: Name
        state:
          type: string
          title: State
        fail_counter:
          type: integer
          title: Fail Counter
      type: object
      required:
      - name
      - state
      - fail_counter
      title: CircuitBreakerState
    ConnectorListResponse:
      properties:
        sources:
          items:
            type: string
          type: array
          title: Sources
        sinks:
          items:
            type: string
          type: array
          title: Sinks
      type: object
      required:
      - sources
      - sinks
      title: ConnectorListResponse
    ConstraintCorrection:
      properties:
        constraint_id:
          type: string
          title: Constraint Id
        severity:
          type: string
          enum:
          - hard
          - soft
          title: Severity
        margin_dB:
          anyOf:
          - type: number
          - type: 'null'
          title: Margin Db
        message:
          type: string
          title: Message
      type: object
      required:
      - constraint_id
      - severity
      - message
      title: ConstraintCorrection
      description: 'One projection-step correction applied by the constraint layer.


        Persisted to the audit so a regulator can reproduce the projection.'
    DecisionRecord:
      properties:
        decision_id:
          type: string
          title: Decision Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        rapp_instance_id:
          type: string
          title: Rapp Instance Id
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        state_hash:
          type: string
          title: State Hash
        state_blob_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: State Blob Uri
        chosen_action:
          additionalProperties: true
          type: object
          title: Chosen Action
        predicted_outcome_chosen:
          $ref: '#/components/schemas/PredictedOutcome'
        rejected_alternatives:
          items:
            $ref: '#/components/schemas/RejectedAlternative'
          type: array
          title: Rejected Alternatives
        constraint_corrections:
          items:
            $ref: '#/components/schemas/ConstraintCorrection'
          type: array
          title: Constraint Corrections
        model_versions:
          $ref: '#/components/schemas/ModelVersions'
        random_seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Random Seed
        actual_outcome_30s:
          anyOf:
          - $ref: '#/components/schemas/PredictedOutcome'
          - type: 'null'
        actual_outcome_1min:
          anyOf:
          - $ref: '#/components/schemas/PredictedOutcome'
          - type: 'null'
        actual_outcome_5min:
          anyOf:
          - $ref: '#/components/schemas/PredictedOutcome'
          - type: 'null'
        operator_override:
          type: boolean
          title: Operator Override
          default: false
        operator_override_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Operator Override Reason
        sla_breach_context:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Sla Breach Context
      type: object
      required:
      - decision_id
      - timestamp
      - rapp_instance_id
      - state_hash
      - chosen_action
      - predicted_outcome_chosen
      - rejected_alternatives
      - model_versions
      title: DecisionRecord
      description: 'Complete record of one rApp policy decision.


        Persisted to the evidence store for regulatory audit (GDPR Art. 30

        records of processing, 3GPP TS 28.105 provenance, NIST SP 800-92 logs).'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ModelVersions:
      properties:
        encoder:
          type: string
          title: Encoder
        risk_heads:
          type: string
          title: Risk Heads
        dyna:
          type: string
          title: Dyna
        policy:
          type: string
          title: Policy
        constraint_layer:
          type: string
          title: Constraint Layer
        rapp:
          type: string
          title: Rapp
      type: object
      required:
      - encoder
      - risk_heads
      - dyna
      - policy
      - constraint_layer
      - rapp
      title: ModelVersions
      description: 'Version tags for the models that produced a decision.


        Required by 3GPP TS 28.105 (AI/ML Management) for provenance.'
    PolicyDetailResponse:
      properties:
        record:
          $ref: '#/components/schemas/DecisionRecord'
        chain_hash:
          type: string
          title: Chain Hash
      type: object
      required:
      - record
      - chain_hash
      title: PolicyDetailResponse
    PolicyListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PolicySummary'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: PolicyListResponse
    PolicySummary:
      properties:
        decision_id:
          type: string
          title: Decision Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        chosen_action:
          additionalProperties: true
          type: object
          title: Chosen Action
        sla_risk_30s:
          type: number
          title: Sla Risk 30S
        sla_risk_1min:
          type: number
          title: Sla Risk 1Min
        sla_risk_5min:
          type: number
          title: Sla Risk 5Min
        rejected_count:
          type: integer
          title: Rejected Count
        chain_hash:
          type: string
          title: Chain Hash
      type: object
      required:
      - decision_id
      - timestamp
      - chosen_action
      - sla_risk_30s
      - sla_risk_1min
      - sla_risk_5min
      - rejected_count
      - chain_hash
      title: PolicySummary
    PredictedOutcome:
      properties:
        sla_risk_30s:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Sla Risk 30S
        sla_risk_1min:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Sla Risk 1Min
        sla_risk_5min:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Sla Risk 5Min
        gateway_loads:
          additionalProperties:
            type: number
          type: object
          title: Gateway Loads
        ntn_capacity_used:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Ntn Capacity Used
          default: 0.0
        energy_kwh:
          type: number
          minimum: 0.0
          title: Energy Kwh
          default: 0.0
        constraint_violations:
          items:
            type: string
          type: array
          title: Constraint Violations
      type: object
      required:
      - sla_risk_30s
      - sla_risk_1min
      - sla_risk_5min
      title: PredictedOutcome
      description: 'Per-decision predicted KPI envelope.


        Names align to 3GPP TS 28.554 §6 KPI definitions where possible.'
    RejectedAlternative:
      properties:
        rank:
          type: integer
          minimum: 1.0
          title: Rank
        action:
          additionalProperties: true
          type: object
          title: Action
        predicted_outcome:
          $ref: '#/components/schemas/PredictedOutcome'
        rejection_reason_machine:
          $ref: '#/components/schemas/RejectionReasonMachine'
        rejection_reason_human:
          type: string
          title: Rejection Reason Human
        random_seed:
          type: integer
          title: Random Seed
          description: 'RNG seed pinned by the planner when this alternative was produced.
            Required for reproducibility (Devil A/C #9, #26).'
      type: object
      required:
      - rank
      - action
      - predicted_outcome
      - rejection_reason_machine
      - rejection_reason_human
      - random_seed
      title: RejectedAlternative
      description: 'One rejected alternative action with its predicted outcome and
        rejection reason.


        `random_seed` pins the planner''s RNG state at the moment this

        alternative was generated. Closes Devil-A/C Finding 9/26: a regulator

        replaying ``(state, action_space, planner_config, random_seed)`` MUST

        obtain the identical alternative, so the counterfactual is auditable.'
    RejectionReasonMachine:
      properties:
        primary_cause:
          type: string
          enum:
          - gateway_overload
          - sla_breach_predicted
          - compute_overload
          - energy_cost
          - ntn_capacity_exhausted
          - spectrum_unavailable
          - constraint_violation_hard
          - constraint_violation_soft
          - policy_oscillation
          title: Primary Cause
        primary_metric:
          type: string
          title: Primary Metric
        predicted_value:
          type: number
          title: Predicted Value
        threshold:
          type: number
          title: Threshold
        horizon:
          type: string
          enum:
          - 30s
          - 60s
          - 300s
          title: Horizon
      type: object
      required:
      - primary_cause
      - primary_metric
      - predicted_value
      - threshold
      - horizon
      title: RejectionReasonMachine
      description: Structured rejection reason — machine-readable for audit dashboards.
    SlaSample:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        horizon:
          type: string
          title: Horizon
        sla_risk:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Sla Risk
        decision_id:
          type: string
          title: Decision Id
      type: object
      required:
      - timestamp
      - horizon
      - sla_risk
      - decision_id
      title: SlaSample
    SlaTimelineResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SlaSample'
          type: array
          title: Items
        horizons:
          items:
            type: string
          type: array
          title: Horizons
        from_ts:
          type: string
          format: date-time
          title: From Ts
        to_ts:
          type: string
          format: date-time
          title: To Ts
      type: object
      required:
      - items
      - horizons
      - from_ts
      - to_ts
      title: SlaTimelineResponse
    StateResponse:
      properties:
        rapp_state:
          type: string
          title: Rapp State
        degraded_state:
          type: string
          title: Degraded State
        watchdog_last_tick:
          type: number
          title: Watchdog Last Tick
        watchdog_interval_s:
          type: number
          title: Watchdog Interval S
        a1_policies_emitted:
          type: integer
          title: A1 Policies Emitted
        last_decision_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Decision Id
        evidence_chain_head:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Chain Head
        rapp_id:
          type: string
          title: Rapp Id
        rapp_version:
          type: string
          title: Rapp Version
        timestamp:
          type: number
          title: Timestamp
        uptime_seconds:
          type: number
          title: Uptime Seconds
      type: object
      required:
      - rapp_state
      - degraded_state
      - watchdog_last_tick
      - watchdog_interval_s
      - a1_policies_emitted
      - last_decision_id
      - evidence_chain_head
      - rapp_id
      - rapp_version
      - timestamp
      - uptime_seconds
      title: StateResponse
    TokenRequest:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: TokenRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          default: 3600
        role:
          type: string
          title: Role
      type: object
      required:
      - access_token
      - role
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
