name: Horizon-NVCF

# Self-contained CI for the additive `nvcf/` subtree, matching agentic.yml /
# ocudu.yml / audit.yml: own path filter, own install, cannot turn the main
# pipeline red.
#
# G10 is a COMPOSITE gate — it drives NVCF -> envelope -> SafetyTransaction
# (with a Shield built from the real OCUDU cell) -> E2SM-RC PER, and stands up
# Horizon's own NVCF-contract service on a real socket. So this workflow's
# path filter deliberately spans the three subtrees it joins: a change to any
# of them can legitimately fail G10 and should run it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "nvcf/**"
      - ".github/workflows/nvcf.yml"
      - "ocudu/src/horizon_ocudu/cell_config.py"
      - "ocudu/src/horizon_ocudu/rc_slice_quota.py"
      - "agentic/src/horizon_agentic/**"
      - "src/horizon_ric/shield/**"
  push:
    branches: [main]
    paths:
      - "nvcf/**"
      - ".github/workflows/nvcf.yml"

permissions:
  contents: read

jobs:
  nvcf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Horizon-RIC
        # `oran` carries asn1tools; G10 encodes real E2SM-RC PER through
        # horizon_ocudu, which needs it. The ocudu job learned this the hard
        # way by passing locally and failing here.
        run: python -m pip install '.[dev,oran]'

      - name: Lint
        run: python -m ruff check nvcf/ ocudu/

      - name: Type-check
        run: |
          python -m mypy \
            --ignore-missing-imports \
            --no-strict-optional \
            nvcf/src/horizon_nvcf ocudu/src/horizon_ocudu

      - name: The vendored NVCF contract has not drifted from its spec
        run: python nvcf/extract_contract.py --check

      - name: Tests
        env:
          PYTHONPATH: src:agentic/src:ocudu/src:nvcf/src
        run: python -m pytest nvcf/tests ocudu/tests -q

      - name: Gate G2 — second band, and no constant retuned to reach it
        run: python ocudu/verify_g2_second_band.py --out "$RUNNER_TEMP/g2.json"

      - name: Gate G9 — the Shield's band comes from the OCUDU cell
        run: python ocudu/verify_g9_cell_envelope.py --out "$RUNNER_TEMP/g9.json"

      - name: Gate G10 — NVCF agents are governed, the plane speaks NVCF
        run: python nvcf/verify_g10_nvcf_conformance.py --out "$RUNNER_TEMP/g10.json"

      - name: Compare both against the committed results
        # Re-running and comparing is what makes a committed JSON evidence
        # rather than a note. Source digests are part of the comparison, so
        # editing a module to make the numbers agree fails here.
        run: |
          python - <<'PY'
          import json, os, sys
          tmp = os.environ["RUNNER_TEMP"]
          problems = []
          for gate, fresh_path, committed_path in (
              ("G2", f"{tmp}/g2.json", "ocudu/results/g2-second-band.json"),
              ("G9", f"{tmp}/g9.json", "ocudu/results/g9-cell-envelope.json"),
              ("G10", f"{tmp}/g10.json", "nvcf/results/g10-nvcf-conformance.json"),
          ):
              fresh = json.load(open(fresh_path))
              committed = json.load(open(committed_path))
              if not fresh["passed"]:
                  problems.append(f"{gate}: fresh run did not pass")
              if not fresh["checks"]:
                  problems.append(f"{gate}: no checks ran; a vacuous pass is not a pass")
              for key in ("gate", "claim", "source_digests"):
                  if fresh[key] != committed[key]:
                      problems.append(f"{gate}: {key} differs from the committed result")
              f = {c["id"]: c["passed"] for c in fresh["checks"]}
              c = {c["id"]: c["passed"] for c in committed["checks"]}
              if f != c:
                  problems.append(f"{gate}: checks differ: {f} vs {c}")
              print(f"{gate} reproduced: {len(fresh['checks'])} checks, digests match")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvcf-ocudu-gates
          path: |
            ${{ runner.temp }}/g2.json
            ${{ runner.temp }}/g9.json
            ${{ runner.temp }}/g10.json
