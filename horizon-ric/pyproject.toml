[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-ric"
version = "0.1.0"
description = "NTN-Aware AI-RAN Resource-Orchestration rApp Suite for O-RAN SMO platforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Preceptual AI"}]
keywords = ["o-ran", "ai-ran", "ntn", "rapp", "smo", "non-rt-ric"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    # Load-bearing core deps imported transitively from horizon_ric/__init__.py.
    # If any of these are missing, every test errors at collection time.
    "python-jose[cryptography]>=3.3",   # security/jwt.py
    "cryptography>=42.0",                # security/hsm.py, evidence/rfc3161.py
    "pybreaker>=1.0",                    # runtime/circuit_breaker.py
    "casbin>=1.36",                      # security/rbac.py
    "authlib>=1.3",                      # rapp/auth.py (OAuth2 client)
    "starlette>=0.37",                   # used by rapp/middleware
    # Observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    # O-RAN / 3GPP integration
    "ncclient>=0.6.15",          # NETCONF client for O1
    "pyang>=2.6",                 # YANG validation
    # Persistence
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.8",
    "bandit>=1.7",
    "syft",  # SBOM generator (binary, not python lib — referenced for docs)
]
itur = [
    "itur>=0.5",  # ITU-R reference Python implementation for validation
]
oran = [
    "asn1tools>=0.166",          # ASN.1 codec for E2/A1
]
crypto = [
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "hvac>=2.0",                  # HashiCorp Vault client
]
fed = [
    "flwr>=1.9",                  # Flower for federated learning
]
hetest = [
    "tenseal>=0.3",               # Homomorphic encryption (Phase 3)
]

[project.scripts]
horizon-rapp = "horizon_ric.rapp.lifecycle:main"
horizon-edge-agent = "horizon_ric.agent.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pragmatic baseline: real errors (E,F,W) + import sorting (I) only.
# Telco/math notation legitimately uses uppercase locals (P, F, K, …),
# so we drop N. UP/B/S/T20/RET/SIM are stylistic and create noise on a
# real-world codebase; they're tracked separately in CODE_QUALITY_REPORT.md.
select = ["E", "F", "W", "I"]
# E501 line-length: line-length = 100 is enforced by formatter, not ruff.
# F401 unused-import: legit for re-export __init__.py; whitelist per-file.
# E402 module-level import not at top: legit for conditional imports.
# E741 ambiguous variable name: legit for math (e.g., `l` for layer index).
# E731 lambda-assignment: legit for short callables.
ignore = ["E501", "E402", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "F841"]
"src/horizon_ric/*/__init__.py" = ["F401"]
"src/horizon_ric/__init__.py" = ["F401"]
"benchmarks/*" = ["F401", "F841"]
"scripts/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an async coroutine",
    "integration: requires a live external service (e.g. real NETCONF server on 8830)",
]

[tool.coverage.run]
source = ["src/horizon_ric"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
