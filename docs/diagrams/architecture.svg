<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0d9488"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    .t{font-size:13px;font-weight:700;fill:#0f172a;}
    .s{font-size:10.5px;fill:#475569;}
    .m{font-size:10px;fill:#64748b;}
    .h{font-size:11px;font-weight:700;fill:#94a3b8;letter-spacing:1px;}
    .cap{font-size:11px;font-weight:700;}
  </style>

  <!-- 1. Agent -->
  <rect x="30" y="40" width="200" height="90" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="42" y="62" class="t" fill="#b91c1c">Federated DSA agent</text>
  <text x="42" y="80" class="s">may be poisoned / drifted /</text>
  <text x="42" y="94" class="s">backdoored / adversarial</text>
  <text x="42" y="112" class="m">emits action = {freq, power,</text>
  <text x="42" y="124" class="m">order, block, ...} as a dict</text>

  <text x="300" y="30" class="h">"AI PROPOSES,  SHIELD DISPOSES"</text>

  <!-- 2. Shield -->
  <rect x="300" y="40" width="380" height="300" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5" rx="10"/>
  <text x="316" y="62" class="t" fill="#0e7490">Decision Safety Shield — dispose(action)</text>
  <text x="316" y="80" class="m">model-independent · check → project → certify (≤ 8 passes to fixpoint)</text>

  <!-- invariant chain -->
  <rect x="316" y="92" width="348" height="30" fill="#fff" stroke="#0891b2" rx="5"/>
  <text x="326" y="111" class="s"><tspan font-weight="700">1. Lawful intercept</tspan>  — TS 33.127 · FAIL-CLOSED</text>
  <rect x="316" y="126" width="348" height="30" fill="#fff" stroke="#0891b2" rx="5"/>
  <text x="326" y="145" class="s"><tspan font-weight="700">2. Spectral mask</tspan>  — TS 38.104 + guard band → clip carrier</text>
  <rect x="316" y="160" width="348" height="30" fill="#fff" stroke="#0891b2" rx="5"/>
  <text x="326" y="179" class="s"><tspan font-weight="700">3. Max EIRP</tspan>  — licence ceiling → reduce power</text>
  <rect x="316" y="194" width="348" height="30" fill="#fff" stroke="#0891b2" rx="5"/>
  <text x="326" y="213" class="s"><tspan font-weight="700">4. NTN/LEO PFD</tspan>  — ITU-R RR Art.21 link budget</text>
  <rect x="316" y="228" width="348" height="30" fill="#fff" stroke="#0891b2" rx="5"/>
  <text x="326" y="247" class="s"><tspan font-weight="700">5. Neural-RX envelope</tspan>  — measured TBLER → fall back to LMMSE</text>
  <rect x="316" y="262" width="348" height="30" fill="#fff" stroke="#0891b2" rx="5"/>
  <text x="326" y="281" class="s"><tspan font-weight="700">6. Constellation + PAPR</tspan>  — legal M-QAM → snap to nearest</text>
  <text x="316" y="312" class="m">grades neural-RX on INDEPENDENT CRC/HARQ telemetry,</text>
  <text x="316" y="325" class="m">never the model's self-report → self-attestation ≠ assurance</text>

  <!-- agent -> shield -->
  <line x1="230" y1="85" x2="300" y2="130" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="232" y="80" class="cap" fill="#dc2626">action</text>

  <!-- E2 telemetry into shield -->
  <line x1="490" y1="470" x2="490" y2="340" stroke="#0d9488" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="500" y="410" class="cap" fill="#0d9488">measured TBLER</text>
  <text x="500" y="424" class="m">(E2 KPM / MAC CRC · HARQ)</text>

  <!-- 3. Output: safe action + certificate -->
  <rect x="750" y="40" width="200" height="140" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="762" y="62" class="t" fill="#15803d">SafetyCertificate</text>
  <text x="762" y="80" class="s">safe_action (legal by</text>
  <text x="762" y="93" class="s">construction) + margins</text>
  <text x="762" y="108" class="s">invariants checked, corrections,</text>
  <text x="762" y="121" class="s">fallback_used, emit_blocked</text>
  <text x="762" y="139" class="s">rng_seed, model_provenance</text>
  <text x="762" y="160" class="m">frozen · immutable ·</text>
  <text x="762" y="172" class="m">fail-closed on residual violation</text>
  <line x1="680" y1="140" x2="750" y2="110" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="686" y="130" class="cap" fill="#16a34a">safe + cert</text>

  <!-- E2 nodes source box -->
  <rect x="400" y="470" width="180" height="55" fill="#fff" stroke="#0d9488" stroke-width="1.5" rx="6"/>
  <text x="412" y="492" class="t">O-CU / O-DU (E2)</text>
  <text x="412" y="510" class="s">independent measurement</text>

  <!-- 4. Evidence chain -->
  <rect x="30" y="400" width="330" height="270" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" rx="10"/>
  <text x="46" y="422" class="t" fill="#6d28d9">Evidence subsystem (tamper-evident)</text>
  <rect x="46" y="435" width="298" height="52" fill="#fff" stroke="#7c3aed" rx="6"/>
  <text x="56" y="455" class="s"><tspan font-weight="700">DecisionRecord</tspan> (pydantic, canonical JSON)</text>
  <text x="56" y="472" class="m">chosen + rejected alternatives + seed (replayable)</text>
  <rect x="46" y="495" width="298" height="52" fill="#fff" stroke="#7c3aed" rx="6"/>
  <text x="56" y="515" class="s"><tspan font-weight="700">SHA-256 hash chain</tspan> — per tenant</text>
  <text x="56" y="532" class="m">hash = sha256(prev ‖ canonical_json(record))</text>
  <rect x="46" y="555" width="298" height="52" fill="#fff" stroke="#ca8a04" rx="6"/>
  <text x="56" y="575" class="s"><tspan font-weight="700">RFC-3161 anchor</tspan> — public TSA signs chain head</text>
  <text x="56" y="592" class="m">nonce + imprint verified · unforgeable vs author</text>
  <rect x="46" y="615" width="298" height="45" fill="#fff" stroke="#16a34a" rx="6"/>
  <text x="56" y="634" class="s"><tspan font-weight="700">Model provenance</tspan> — RSA-PSS(weights ‖ manifest)</text>
  <text x="56" y="650" class="m">HSM-held key · integrity ≠ authenticity · pinned</text>

  <!-- cert -> evidence -->
  <line x1="795" y1="180" x2="360" y2="440" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="373" y="392" class="cap" fill="#6d28d9">every disposition →</text>
  <text x="373" y="406" class="m">hash-chained + anchored</text>

  <!-- 5. Federated trust stack (as producer of the agent) -->
  <rect x="620" y="400" width="330" height="270" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="10"/>
  <text x="636" y="422" class="t" fill="#4338ca">Federated trust stack (honestly graded)</text>
  <rect x="636" y="435" width="298" height="40" fill="#fff" stroke="#4f46e5" rx="6"/>
  <text x="646" y="453" class="s"><tspan font-weight="700">Robust agg</tspan> — Krum/median/trimmed (BOUND,</text>
  <text x="646" y="468" class="m">proven defeated by ALIE/Fang/Min-Max/Min-Sum)</text>
  <rect x="636" y="483" width="298" height="40" fill="#fff" stroke="#4f46e5" rx="6"/>
  <text x="646" y="501" class="s"><tspan font-weight="700">Secure agg</tspan> — Shamir + verifiable 2-server</text>
  <text x="646" y="516" class="m">honest-but-curious · Feldman tamper-detect = 1.0</text>
  <rect x="636" y="531" width="298" height="40" fill="#fff" stroke="#4f46e5" rx="6"/>
  <text x="646" y="549" class="s"><tspan font-weight="700">DP-FedAvg</tspan> — Rényi accountant (ε,δ)</text>
  <text x="646" y="564" class="m">MIA AUC 0.97 → 0.47 as ε falls</text>
  <rect x="636" y="579" width="298" height="40" fill="#fff" stroke="#16a34a" rx="6"/>
  <text x="646" y="597" class="s"><tspan font-weight="700">Certified unlearning + GDPR erasure</tspan></text>
  <text x="646" y="612" class="m">backdoor 1.0 → 0.036 · signed certificate</text>
  <text x="636" y="640" class="m">REPAIR layer: removes what aggregation only bounds;</text>
  <text x="636" y="654" class="m">Shield remains the backstop for the stealthy backdoor</text>

  <line x1="620" y1="500" x2="130" y2="130" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="150" y="300" class="cap" fill="#4338ca">shared policy →</text>
  <text x="150" y="315" class="m">drives the agent's decisions</text>
</svg>
