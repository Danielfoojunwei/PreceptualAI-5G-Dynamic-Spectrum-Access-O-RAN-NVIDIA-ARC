name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # for cosign keyless if used in the future
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: |
            horizonric/rapp:${{ steps.ver.outputs.version }}
          load: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_KEY }}" > /tmp/cosign.key
          cosign sign --yes --key /tmp/cosign.key \
            horizonric/rapp:${{ steps.ver.outputs.version }}
          rm /tmp/cosign.key

      - name: Generate + attach SBOM
        if: github.event_name != 'pull_request'
        run: |
          pip install cyclonedx-bom==7.3.0
          cyclonedx-py environment --sv 1.5 --of JSON \
            --output-file deploy/sbom/horizon-ric-sbom.json \
            --pyproject pyproject.toml
          cosign attach sbom --type cyclonedx \
            --sbom deploy/sbom/horizon-ric-sbom.json \
            horizonric/rapp:${{ steps.ver.outputs.version }}
