# Prometheus scrape config for the PreceptualAI local stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: horizon-local
    rapp_id: horizon-ric-rapp

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: horizon-rapp
    metrics_path: /metrics
    static_configs:
      - targets: ["horizon-rapp:8081", "horizon-rapp:8082"]
        labels:
          service: horizon-rapp

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
