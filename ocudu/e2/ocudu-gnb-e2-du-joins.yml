# OCUDU gNB config under which the DU-side E2 agent ACTUALLY JOINS the RIC.
#
# Differs from deploy/e2-companion/ocudu-gnb-e2.yml in exactly two things, and
# both are required:
#
#   1. device_driver: zmq -> realtime_loopback  (+ empty device_args)
#      This is the one that matters. With the ZMQ driver and no ZMQ
#      counterparty listening on tcp://127.0.0.1:2001, du_hi->start() blocks
#      FOREVER inside mac_cell_processor::start(). o_du_high_impl::start()
#      calls du_hi->start() before e2agent->start(), so the DU E2 agent is
#      constructed, has its Style 2 Action 6 executor registered, and is then
#      never started. It is not misconfigured and not disabled - it is
#      stranded behind a hung call.
#
#   2. expert_execution.threads
#      realtime_loopback aborts on this host without it:
#        "Maximum PUSCH and SRS concurrency (i.e., 2) exceeds the number of
#         main pool threads (i.e., 1)."
#      So this block is load-bearing, not tuning.
#
# Verified on OCUDU f46f580 + FlexRIC ef6d722f under the SCTP->UDP shim.
# RIC witness: three E2 SETUP-REQUESTs, RAN types ngran_gNB, ngran_gNB_CUUP
# and ngran_gNB_DU, each accepted for RAN function 3 (ORAN-E2SM-RC).
# gNB witness: E2-CU-CP, E2-CU-UP and E2-DU all log
# "E2 Setup procedure successful"; 734 DU bring-up lines vs 0 with ZMQ.
#
# See DU_E2_FINDING.md for the full evidence and for the claim it corrects.

# OCUDU gNB configuration for the E2 join against FlexRIC's near-RT RIC.
# ZMQ RF (no radio hardware), no 5G core, no UE: enough to bring the gNB up
# and drive a real E2 Setup. See OCUDU_E2_JOIN_PROOF.md.
cu_cp:
  amf:
    no_core: true
    addr: 127.0.0.1
    port: 38412
    bind_addr: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: realtime_loopback
  device_args: ""
  srate: 11.52
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1

e2:
  enable_du_e2: true
  enable_cu_cp_e2: true
  enable_cu_up_e2: true
  addr: 127.0.0.1
  port: 36421
  bind_addr: 127.0.0.1
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true

log:
  filename: stdout
  all_level: warning
  e2ap_level: debug

pcap:
  e2ap_enable: true
  e2ap_cu_cp_filename: /tmp/cu_cp_e2ap.pcap
  e2ap_du_filename: /tmp/du_e2ap.pcap

expert_execution:
  threads:
    main_pool:
      nof_threads: 4
    upper_phy:
      max_pusch_and_srs_concurrency: 1
      max_pucch_concurrency: 1
      max_pdsch_concurrency: 1
