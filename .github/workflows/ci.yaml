name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main, "claude/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: horizon-ric

jobs:
  # -------------------------------------------------------------------
  # Lint — fast feedback on style / import ordering
  # -------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (E/F/W/I — real errors + import sorting)
        run: ruff check src/ tests/

  # -------------------------------------------------------------------
  # Type-check — static analysis with mypy (informational)
  # -------------------------------------------------------------------
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy (informational)
        run: mypy src/horizon_ric --ignore-missing-imports --no-strict-optional || true

  # -------------------------------------------------------------------
  # Test — pytest fast pack
  # -------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto,oran,fed]" || pip install -e ".[dev]"

      - name: Run fast test pack
        run: |
          pytest tests/ -q --maxfail=20 -m "not integration and not slow" --tb=short
