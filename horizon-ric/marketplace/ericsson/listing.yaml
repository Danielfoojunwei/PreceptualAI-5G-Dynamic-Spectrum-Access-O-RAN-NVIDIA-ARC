# Ericsson Marketplace listing — PreceptualAI rApp.
#
# Format follows the public Ericsson Developer Studio rApp submission
# template. Fields not exposed in the public template are commented and
# filled in via the Ericsson partner portal at submission time.
listingType: rapp
listingVersion: 1.0
metadata:
  name: PreceptualAI
  shortName: horizon-ric
  version: 0.2.0
  vendorName: Preceptual AI
  vendorContact: danielfoojunwei@gmail.com
  category:
    - non-rt-ric
    - ai-ml
    - closed-loop-optimisation
  shortDescription: >
    SLA-risk forecasting and A1 policy recommendation rApp with
    multi-vendor SMO support (EIAP, OSC NONRTRIC, Nokia MantaRay).
  longDescription: >
    PreceptualAI ships a real Ericsson EIAP A1 dialect — policies are
    PUT to /A1-PolicyManagement/v2/policies with the camelCase rApp
    SDK contract (policyId, policyTypeId, ricId, policyData). OAuth2
    client-credentials with the Ericsson IDP is the default auth path.
    Runs federated learning on Jetson Orin Nano edges and aggregates
    on a single NVIDIA GB10 datacentre node — weights-only, no PII.
compatibility:
  smo:
    - eiap
  ericssonProductIntegration:
    - "Ericsson Intelligent Automation Platform"
    - "Ericsson Service Orchestration and Assurance"
  oranWG:
    - WG2
    - WG11
deployment:
  packaging: helm
  helmChart: oci://ghcr.io/preceptual-ai/horizon-ric
  helmChartVersion: 0.2.0
  resources:
    cpu: 4
    memory: 8Gi
    gpu: optional
licensing:
  model: subscription
  trial:
    available: true
    durationDays: 30
  license: Apache-2.0
support:
  level: business-hours
  responseTimeHours: 24
  contact: danielfoojunwei@gmail.com
security:
  ericssonSecurityReview: pending  # filled in by Ericsson during onboarding
  auth:
    - oauth2-client-credentials
    - mtls
  dataResidency: customer-controlled
documentation:
  integrationGuide: docs/SMO_INTEGRATION.md
  conformanceStatement: docs/conformance/SoC.yaml
  api: docs/openapi/horizon-ric.yaml
