[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-ric"
version = "0.2.0"
description = "Security & trust rApp for AI-RAN — a Decision Safety Shield, at-decision-time evidence chain, model provenance, and robust federated aggregation for O-RAN neural-PHY/RIC decisions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Preceptual AI"}]
keywords = [
    "o-ran", "ai-ran", "rapp", "non-rt-ric", "security", "trust",
    "ai-security", "neural-phy", "safety-shield", "audit", "counterfactual",
    "model-provenance", "robust-aggregation", "ai-ran-alliance", "wg11",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Security",
]

# Deliberately torch-free. The Shield validates the *decisions* a neural-PHY
# block emits (in production, from NVIDIA Aerial cuBB / O-RAN E2 KPM); it never
# runs a neural network itself. Everything here installs on a stock Python 3.10+
# with no CUDA / no accelerator.
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "starlette>=0.37",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    "python-jose[cryptography]>=3.3",   # security/jwt.py
    "cryptography>=42.0",                # security/hsm.py, provenance
    "rfc3161-client>=0.1.2",             # evidence/rfc3161.py (real RFC-3161 TSA anchor)
    "pybreaker>=1.0",                    # runtime/circuit_breaker.py
    "casbin>=1.36",                      # security/rbac.py
    "authlib>=1.3",                      # rapp/auth.py (OAuth2 client)
    "sqlalchemy>=2.0",                   # evidence/store.py (SqliteEvidenceStore)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.8",
    "bandit>=1.7",
    "z3-solver>=4.13",       # tests/test_rbac_smt_completeness.py
]
# O-RAN southbound wire integrations (NETCONF/YANG for O1, ASN.1 for A1/E2).
oran = [
    "ncclient>=0.6.15",
    "pyang>=2.6",
    "asn1tools>=0.166",
]
# OpenTelemetry tracing export.
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
# Postgres driver for the evidence store (SQLite via stdlib + SQLAlchemy core).
persistence = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
horizon-rapp = "horizon_ric.rapp.lifecycle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "F841"]
"src/horizon_ric/*/__init__.py" = ["F401"]
"src/horizon_ric/__init__.py" = ["F401"]
"benchmarks/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an async coroutine",
    "integration: requires a live external service (e.g. real NETCONF server)",
    "slow: mark test as slow (excluded from the fast pack via -m 'not slow').",
]

[tool.coverage.run]
source = ["src/horizon_ric"]
branch = true

[tool.coverage.report]
show_missing = true
