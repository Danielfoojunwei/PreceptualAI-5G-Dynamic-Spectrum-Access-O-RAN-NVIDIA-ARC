name: External dataset reproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "datasets/deepmimo_asu_3p5/**"
      - "benchmarks/deepmimo_dsa_benchmark.py"
      - "benchmarks/results/deepmimo_dsa.json"
      - "benchmarks/federated_coverage_loop.py"
      - "benchmarks/results/federated_coverage.json"
      - "benchmarks/beam_management_loop.py"
      - "benchmarks/results/beam_management.json"
      - "src/horizon_ric/data/lineage.py"
      - "src/horizon_ric/federated/**"
      - "scripts/verify_deepmimo_reproduction.py"
      - "scripts/verify_federated_coverage.py"
      - "scripts/verify_beam_management.py"
      - ".github/workflows/realdata.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  deepmimo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install '.[dev,realdata]'
      - name: Download, hash and transform DeepMIMO scenario
        run: |
          python datasets/deepmimo_asu_3p5/build.py \
            --cache-dir "$RUNNER_TEMP/deepmimo" \
            --features "$RUNNER_TEMP/channel_features.jsonl" \
            --manifest "$RUNNER_TEMP/manifest.json"
      - name: Reproduce aggregate benchmark
        run: |
          python benchmarks/deepmimo_dsa_benchmark.py \
            --features "$RUNNER_TEMP/channel_features.jsonl" \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --out "$RUNNER_TEMP/deepmimo_dsa.json"
      - name: Verify committed evidence
        run: |
          python scripts/verify_deepmimo_reproduction.py \
            --expected-manifest datasets/deepmimo_asu_3p5/manifest.json \
            --actual-manifest "$RUNNER_TEMP/manifest.json" \
            --expected-result benchmarks/results/deepmimo_dsa.json \
            --actual-result "$RUNNER_TEMP/deepmimo_dsa.json" \
            --absolute-float-tolerance 0.0001
      - name: Reproduce federated coverage loop on real data
        # Exits non-zero unless clean FL learns, the poison diverges plain
        # FedAvg, Krum defends, the over-power fill is corrected and the
        # evidence chain verifies then catches a tamper — all on real channels.
        run: |
          python benchmarks/federated_coverage_loop.py \
            --features "$RUNNER_TEMP/channel_features.jsonl" \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --out "$RUNNER_TEMP/federated_coverage.json"
      - name: Verify committed federated-coverage evidence
        run: |
          python scripts/verify_federated_coverage.py \
            --committed-result benchmarks/results/federated_coverage.json \
            --actual-result "$RUNNER_TEMP/federated_coverage.json" \
            --actual-manifest "$RUNNER_TEMP/manifest.json"
      - name: Build real angular ray geometry
        # Reuses the already-downloaded, checksum-pinned scenario cache.
        run: |
          python datasets/deepmimo_asu_3p5/build_angular.py \
            --cache-dir "$RUNNER_TEMP/deepmimo" \
            --features "$RUNNER_TEMP/angular_features.jsonl" \
            --manifest "$RUNNER_TEMP/angular_manifest.json"
      - name: Reproduce beam-management loop on real angular data
        # Exits non-zero unless real coherent array gain and misalignment
        # recovery hold, the codebook is genuinely swept, the over-EIRP beam is
        # corrected, and the evidence chain verifies then catches a tamper.
        run: |
          python benchmarks/beam_management_loop.py \
            --features "$RUNNER_TEMP/angular_features.jsonl" \
            --manifest "$RUNNER_TEMP/angular_manifest.json" \
            --out "$RUNNER_TEMP/beam_management.json"
      - name: Verify committed beam-management evidence
        run: |
          python scripts/verify_beam_management.py \
            --committed-result benchmarks/results/beam_management.json \
            --actual-result "$RUNNER_TEMP/beam_management.json" \
            --actual-manifest "$RUNNER_TEMP/angular_manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepmimo-reproduction-evidence
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/deepmimo_dsa.json
            ${{ runner.temp }}/federated_coverage.json
            ${{ runner.temp }}/beam_management.json
