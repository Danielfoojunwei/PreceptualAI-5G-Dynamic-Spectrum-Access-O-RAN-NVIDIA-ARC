# SpectrAI Federated Learning — Multi-Device Docker Compose Stack
#
# Launches a complete FL deployment with:
#   - 1 Aggregation server (central FL coordinator)
#   - 3 Edge devices (each with their own 5G trace subset)
#   - 1 Prometheus instance for metrics collection
#
# Usage:
#   docker compose -f docker/docker-compose.fl.yaml up --build
#
# The aggregation server exposes:
#   - gRPC on port 50051
#   - Prometheus metrics on port 9090 (via sidecar)
#
# Each edge device mounts a subset of the 5G dataset and trains locally,
# uploading weights to the aggregator each round.

services:
  # ==================================================================
  # Central Aggregation Server
  # ==================================================================
  aggregator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spectrai-fl-aggregator
    command: >
      python -m spectrai.federated.server
        --host 0.0.0.0
        --port 50051
        --aggregation_method hybrid_ltc
        --tau_mix_ratio 0.3
        --min_devices 3
        --num_rounds 50
        --local_steps 1000
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      - SPECTRAI_ROLE=aggregator
      - SPECTRAI_FL_METHOD=hybrid_ltc
      - SPECTRAI_FL_TAU_MIX=0.3
      - SPECTRAI_FL_MIN_DEVICES=3
      - SPECTRAI_FL_NUM_ROUNDS=50
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    volumes:
      - aggregator-state:/app/state
      - fl-models:/app/models
    networks:
      - spectrai-fl
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "2.0"
          memory: 2G

  # ==================================================================
  # Edge Device 1 — Urban / Driving traces
  # ==================================================================
  edge-device-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spectrai-fl-edge-1
    command: >
      python -m spectrai.federated.client_main
        --device_id edge-device-1
        --aggregator_host aggregator
        --aggregator_port 50051
        --data_dir /data/traces
        --num_channels 5
        --local_steps 1000
    environment:
      - SPECTRAI_ROLE=edge_device
      - SPECTRAI_DEVICE_ID=edge-device-1
      - SPECTRAI_AGGREGATOR=aggregator:50051
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${DATA_DIR:-./data}/urban_driving:/data/traces:ro
      - edge1-state:/app/state
    networks:
      - spectrai-fl
    depends_on:
      aggregator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G

  # ==================================================================
  # Edge Device 2 — Suburban / Static traces
  # ==================================================================
  edge-device-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spectrai-fl-edge-2
    command: >
      python -m spectrai.federated.client_main
        --device_id edge-device-2
        --aggregator_host aggregator
        --aggregator_port 50051
        --data_dir /data/traces
        --num_channels 5
        --local_steps 1000
    environment:
      - SPECTRAI_ROLE=edge_device
      - SPECTRAI_DEVICE_ID=edge-device-2
      - SPECTRAI_AGGREGATOR=aggregator:50051
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${DATA_DIR:-./data}/suburban_static:/data/traces:ro
      - edge2-state:/app/state
    networks:
      - spectrai-fl
    depends_on:
      aggregator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G

  # ==================================================================
  # Edge Device 3 — Mixed / Streaming traces
  # ==================================================================
  edge-device-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: spectrai-fl-edge-3
    command: >
      python -m spectrai.federated.client_main
        --device_id edge-device-3
        --aggregator_host aggregator
        --aggregator_port 50051
        --data_dir /data/traces
        --num_channels 5
        --local_steps 1000
    environment:
      - SPECTRAI_ROLE=edge_device
      - SPECTRAI_DEVICE_ID=edge-device-3
      - SPECTRAI_AGGREGATOR=aggregator:50051
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${DATA_DIR:-./data}/mixed_streaming:/data/traces:ro
      - edge3-state:/app/state
    networks:
      - spectrai-fl
    depends_on:
      aggregator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G

  # ==================================================================
  # Prometheus — Metrics Collection
  # ==================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spectrai-fl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-fl.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - spectrai-fl
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - aggregator

# ==================================================================
# Networks
# ==================================================================
networks:
  spectrai-fl:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ==================================================================
# Volumes
# ==================================================================
volumes:
  aggregator-state:
    driver: local
  fl-models:
    driver: local
  edge1-state:
    driver: local
  edge2-state:
    driver: local
  edge3-state:
    driver: local
  prometheus-data:
    driver: local
