# OCUDU gNB configuration for the E2 join against FlexRIC's near-RT RIC.
# ZMQ RF (no radio hardware), no 5G core, no UE: enough to bring the gNB up
# and drive a real E2 Setup. See OCUDU_E2_JOIN_PROOF.md.
cu_cp:
  amf:
    no_core: true
    addr: 127.0.0.1
    port: 38412
    bind_addr: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1

e2:
  enable_du_e2: true
  enable_cu_cp_e2: true
  enable_cu_up_e2: true
  addr: 127.0.0.1
  port: 36421
  bind_addr: 127.0.0.1
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true

log:
  filename: stdout
  all_level: warning
  e2ap_level: debug

pcap:
  e2ap_enable: true
  e2ap_cu_cp_filename: /tmp/cu_cp_e2ap.pcap
  e2ap_du_filename: /tmp/du_e2ap.pcap
