# TM Forum Open Digital Architecture (ODA) Component Manifest
# Reference: TM Forum IG1171 "ODA Component Definition", TMF630 API design
# guidelines, and the TMF Open API Table at
# https://www.tmforum.org/oda/directory/components-r19
#
# This manifest declares Horizon-RIC as a Production-class ODA component.
# It is consumed by ODA Canvas and by TMF Component Conformance Certification.
apiVersion: oda.tmforum.org/v1beta3
kind: Component
metadata:
  name: horizon-ric
  labels:
    oda.tmforum.org/componentName: horizon-ric
    oda.tmforum.org/componentVersion: 0.2.0
    oda.tmforum.org/componentType: Production
spec:
  componentName: horizon-ric
  type: Production
  version: 0.2.0
  description: >
    Horizon-RIC is an O-RAN compliant rApp delivering AI-driven SLA risk
    forecasting, autonomous policy emission and audit-grade decision
    provenance for non-RT RIC deployments. Implements TMF640 Service
    Activation, TMF638 Service Inventory and TMF724 Intent Management
    surfaces.
  vendor: Horizon-RIC
  maintainers:
    - name: Horizon-RIC Engineering
      email: ops@horizon-ric.example.com

  # Core function: business capabilities offered by this component
  coreFunction:
    - name: NetworkSliceManagement
      description: >
        Slice-aware SLA forecasting + A1 policy emission per
        3GPP TS 28.541 NRM and O-RAN A1AP §6.
    - name: AIMLOperations
      description: >
        TS 28.105 AI/ML lifecycle management (training, inference,
        evaluation and model card emission) for SLA risk heads, policy
        priors and dynamics models.

  # Management functions: how operators run / observe / govern us
  managementFunction:
    - name: Lifecycle
      description: K8s + systemd lifecycle, sd_notify ready/stopping signals.
    - name: Monitoring
      description: >
        Prometheus metrics on :8081/metrics, OpenTelemetry OTLP spans for
        every decision (decision_id, latency_ms, sla_breach_count,
        constraint_violations).
    - name: Audit
      description: >
        Tamper-evident SQLite-backed evidence store with hash chain;
        verifiable via /v1/audit/verify.

  # APIs we expose (referenced by TMF642 / Subscription / Service Inventory)
  exposedAPIs:
    - name: horizon-ric-operator
      apiType: openapi
      specification: docs/openapi/horizon-ric-rapp.yaml
      version: 0.2.0
      implementation: src/horizon_ric/rapp/api.py
      path: /api/v1
    - name: horizon-ric-r1-service
      apiType: o-ran-r1
      specification: O-RAN.WG2.R1AP-v06.00
      implementation: src/horizon_ric/rapp/r1_adapter.py
    - name: horizon-ric-a1-policy
      apiType: o-ran-a1
      specification: O-RAN.WG2.A1AP-v05.00
      implementation: src/horizon_ric/rapp/a1_adapter.py
    - name: horizon-ric-prometheus
      apiType: prometheus
      path: /metrics
      port: 8081
      implementation: src/horizon_ric/rapp/health.py

  # APIs we consume (TMF Subscription / dependency declaration)
  consumedAPIs:
    - name: o-ran-r1
      apiType: o-ran-r1
      specification: O-RAN.WG2.R1AP-v06.00
      required: true
    - name: o-ran-a1
      apiType: o-ran-a1
      specification: O-RAN.WG2.A1AP-v05.00
      required: true
    - name: o-ran-o1
      apiType: o-ran-o1
      specification: O-RAN.WG2.O1-v06.00
      required: true
      note: NETCONF/YANG via ncclient, optional at runtime (gated import).

  # Security per O-RAN.WG11 §6 (Security Specification)
  security:
    transport:
      - name: mTLS
        spec: O-RAN.WG11 §6.2
        implementation: src/horizon_ric/rapp/auth.py
    authentication:
      - name: OAuth2
        spec: RFC 6749 + O-RAN.WG11 §6.3
        implementation: src/horizon_ric/rapp/auth.py
      - name: BearerJWT
        spec: RFC 7519 + O-RAN.WG11 §6.3
        implementation: src/horizon_ric/rapp/api.py
        algorithms: [HS256, RS256]
    authorization:
      - name: RBAC-Casbin
        spec: src/horizon_ric/security/rbac.py
        model: src/horizon_ric/security/rbac_model.conf
        policy: src/horizon_ric/security/rbac_policy.csv

  # Conformance claims — every entry is detailed in docs/conformance/CONFORMANCE.md
  conformance:
    - standard: TMF640
      name: Service Activation and Configuration
      status: planned
    - standard: TMF638
      name: Service Inventory
      status: planned
    - standard: TMF724
      name: Intent Management
      status: planned
    - standard: O-RAN.WG2.R1AP-v06.00
      status: partial
    - standard: O-RAN.WG2.A1AP-v05.00
      status: implemented
    - standard: O-RAN.WG2.O1-v06.00
      status: implemented
    - standard: O-RAN.WG11
      name: Security Specification
      status: implemented
    - standard: 3GPP-TS-28.105
      name: AI/ML management
      status: implemented
    - standard: 3GPP-TS-28.541
      name: NRM
      status: partial
    - standard: 3GPP-TS-28.552
      name: KPI definitions
      status: implemented

  # Operational SLOs (mirrors deploy/SLO.md)
  slos:
    decisionLatencyP95Ms: 250
    decisionEmissionUptime: 0.999
    auditChainIntegrity: 1.0

  # Container artefact identity (signed via cosign — see deploy/cosign/)
  image:
    repository: horizonric/rapp
    tag: 0.2.0
    signed: true
    cosignPublicKey: deploy/cosign/cosign.pub
    sbom: deploy/sbom/horizon-ric-sbom.json
    sbomFormat: CycloneDX-1.5
