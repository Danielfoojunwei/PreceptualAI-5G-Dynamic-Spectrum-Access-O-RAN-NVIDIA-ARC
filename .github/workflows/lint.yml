name: lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      # Whole-tree lint: src, tests, scripts and deploy (osc_emulator etc.)
      # are all gated — the full tree passes `ruff check` clean.
      - run: ruff check src tests scripts deploy

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          pip install -e ".[dev]"
          pip install mypy
      - name: mypy (informational, full tree)
        # Full-package run stays visible in the logs but does NOT gate:
        # src/horizon_ric as a whole still has ~100 known errors in 35
        # files (rapp/*_adapter.py, rapp/api_v1.py, provenance/signing.py,
        # phy/*, security/{hsm,jwt,middleware}.py, federated/*, io/*,
        # spectrum/*, evidence/rfc3161.py, evidence/store.py,
        # shield/invariants.py, policy/counterfactual.py,
        # observability/tracing.py, runtime/state_recovery.py).
        run: mypy src/horizon_ric --ignore-missing-imports || true
      - name: mypy gate (clean subset, enforced)
        # GATED — no `|| true`: the 47 modules below type-check clean
        # today and any regression in them fails CI. Everything listed in
        # the informational step's comment above is NOT gated yet; move a
        # file into this list once its errors are fixed.
        # `--follow-imports=silent` scopes error reporting to exactly the
        # listed files (imports are still analysed for type information).
        run: |
          mypy --ignore-missing-imports --follow-imports=silent \
            src/horizon_ric/__init__.py \
            src/horizon_ric/cli.py \
            src/horizon_ric/data/__init__.py \
            src/horizon_ric/data/lineage.py \
            src/horizon_ric/evidence/__init__.py \
            src/horizon_ric/evidence/ai_phy_lineage.py \
            src/horizon_ric/evidence/explanation.py \
            src/horizon_ric/evidence/schema.py \
            src/horizon_ric/federated/__init__.py \
            src/horizon_ric/federated/erasure.py \
            src/horizon_ric/federated/secure.py \
            src/horizon_ric/federated/unlearning.py \
            src/horizon_ric/io/__init__.py \
            src/horizon_ric/io/connectors/__init__.py \
            src/horizon_ric/io/connectors/file_connector.py \
            src/horizon_ric/io/connectors/http_connector.py \
            src/horizon_ric/observability/__init__.py \
            src/horizon_ric/observability/model_card.py \
            src/horizon_ric/observability/x733_alarms.py \
            src/horizon_ric/phy/__init__.py \
            src/horizon_ric/phy/jamming.py \
            src/horizon_ric/policy/__init__.py \
            src/horizon_ric/policy/emit_guards.py \
            src/horizon_ric/policy/li_constraint.py \
            src/horizon_ric/provenance/__init__.py \
            src/horizon_ric/rapp/__init__.py \
            src/horizon_ric/rapp/api.py \
            src/horizon_ric/rapp/sd_notify.py \
            src/horizon_ric/runtime/__init__.py \
            src/horizon_ric/runtime/artefact_vault.py \
            src/horizon_ric/runtime/atomic_promotion.py \
            src/horizon_ric/runtime/circuit_breaker.py \
            src/horizon_ric/runtime/graceful_degradation.py \
            src/horizon_ric/runtime/liveness.py \
            src/horizon_ric/runtime/loop_state.py \
            src/horizon_ric/runtime/shadow_executor.py \
            src/horizon_ric/runtime/watchdog.py \
            src/horizon_ric/security/__init__.py \
            src/horizon_ric/security/nis2_reporter.py \
            src/horizon_ric/security/rbac.py \
            src/horizon_ric/security/tenant.py \
            src/horizon_ric/shield/__init__.py \
            src/horizon_ric/shield/certificate.py \
            src/horizon_ric/shield/shield.py \
            src/horizon_ric/shield/signing.py \
            src/horizon_ric/spectrum/__init__.py \
            src/horizon_ric/spectrum/attacks.py \
            src/horizon_ric/spectrum/federated_q.py

  yang-strict:
    # Real strict YANG validation gate. Closes Row 9: any change to a
    # vendored YANG module that breaks `pyang --strict --canonical` fails CI.
    # Modules listed in `deploy/yang/known_strict_violations.md` are
    # tolerated (upstream RFC / 3GPP defects) — every other module MUST
    # validate clean. See deploy/yang/manifest.json for SHA-256 + URL.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pyang
        run: pip install pyang==2.7.1
      - name: pyang --strict --canonical (informational, all modules)
        run: |
          set +e
          for f in deploy/yang/*.yang; do
            echo "=== $(basename $f) ==="
            pyang --strict --canonical -p deploy/yang/ "$f"
          done
          true
      - name: pyang strict gate on enforced subset
        run: |
          # Strict-clean enforcement: parse known_strict_violations.md to
          # build the skip list, then fail the job if any other module
          # produces output on stdout/stderr.
          python - <<'PY'
          import pathlib, re, subprocess, sys
          root = pathlib.Path("deploy/yang")
          violations_doc = (root / "known_strict_violations.md").read_text()
          # Only count modules listed in the violations section (above
          # "## Strict-clean"); the trailing table lists modules that DO
          # pass strict.
          if "## Strict-clean" in violations_doc:
              violations_doc = violations_doc.split("## Strict-clean", 1)[0]
          skip = set(re.findall(r"`([\w@.\-]+\.yang)`", violations_doc))
          fail = []
          for mod in sorted(root.glob("*.yang")):
              if mod.name in skip:
                  continue
              proc = subprocess.run(
                  ["pyang", "--strict", "--canonical", "-p", str(root), str(mod)],
                  capture_output=True, text=True,
              )
              if proc.returncode != 0 or proc.stdout.strip() or proc.stderr.strip():
                  fail.append((mod.name, proc.stdout + proc.stderr))
          if fail:
              for name, out in fail:
                  print(f"\n=== STRICT FAIL: {name} ===\n{out}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(list(root.glob('*.yang'))) - len(skip)} modules strict-clean.")
          PY
