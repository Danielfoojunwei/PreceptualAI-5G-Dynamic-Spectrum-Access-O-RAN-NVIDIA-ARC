{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "horizon-ric.fullname" . }}
  labels:
    {{- include "horizon-ric.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "horizon-ric.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus operator (or any in-cluster scraper) to hit /metrics
    # and probes from any pod in the cluster.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.healthPort }}
        - protocol: TCP
          port: {{ .Values.metricsPort }}
  egress:
    # DNS — needed for any name resolution.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.dnsCidr }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SMO + IDP egress (R1, A1, OAuth2 token endpoint).
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.smoCidr }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 10000
    {{- if ne .Values.networkPolicy.idpCidr .Values.networkPolicy.smoCidr }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.idpCidr }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
