# Horizon-RIC local stack — rApp + edge agent + Prometheus + Grafana.
# Bring up: docker compose up -d
# Smoke check (60s): curl -fsS http://localhost:8081/healthz
#                    curl -fsS http://localhost:8082/metrics
#                    open http://localhost:3000  (admin/admin)

name: horizon-ric

services:
  horizon-rapp:
    image: horizonric/rapp:0.2.0
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        VERSION: ${HORIZON_VERSION:-0.2.0}
    container_name: horizon-rapp
    restart: unless-stopped
    environment:
      HORIZON_RAPP_ID: horizon-ric-rapp
      HORIZON_SMO_URL: http://nonrtric:8080
      HORIZON_NEAR_RT_RIC_URL: http://nearrtric:10000
      HORIZON_HEALTH_HOST: 0.0.0.0
      HORIZON_HEALTH_PORT: "8081"
      HORIZON_METRICS_PORT: "8082"
      HORIZON_STATE_DIR: /var/lib/horizon
      SPACE_TRACK_IDENTITY: ${SPACE_TRACK_IDENTITY:-}
      SPACE_TRACK_PASSWORD: ${SPACE_TRACK_PASSWORD:-}
    command: ["--source-config", "/opt/horizon/scripts/local-dev.yaml"]
    ports:
      - "8081:8081"   # /healthz, /readyz
      - "8082:8082"   # /metrics
    volumes:
      - evidence-store:/var/lib/horizon
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - horizon-net

  horizon-edge-agent:
    image: horizonric/edge:0.2.0
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.edge
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        VERSION: ${HORIZON_VERSION:-0.2.0}
    container_name: horizon-edge-agent
    restart: unless-stopped
    environment:
      HORIZON_HEAD_CKPT: /opt/horizon/checkpoints/sla_head_v0.4_jepa.pt
    # Edge agent reads stdin, so default it to a stub feed for demo. In a
    # real Jetson deployment this would be replaced by a stream from the
    # local KPI collector.
    command: ["--latent-dim", "128", "--max-iterations", "5"]
    stdin_open: true
    tty: false
    networks:
      - horizon-net
    depends_on:
      horizon-rapp:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: horizon-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - horizon-net

  grafana:
    image: grafana/grafana:latest
    container_name: horizon-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - horizon-net

volumes:
  evidence-store:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/evidence
  prom-data:
  grafana-data:

networks:
  horizon-net:
    name: horizon-net
    driver: bridge
