{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "horizon-ric.fullname" . }}
  labels:
    {{- include "horizon-ric.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "horizon-ric.selectorLabels" . | nindent 6 }}
  endpoints:
    # /metrics lives on the metrics port in pipeline mode but on the health
    # port in bare-lifecycle mode (see the port story in values.yaml) —
    # scrape whichever port the active mode actually serves.
    {{- if .Values.pipeline.enabled }}
    - port: metrics
    {{- else }}
    - port: health
    {{- end }}
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      honorLabels: true
{{- end }}
