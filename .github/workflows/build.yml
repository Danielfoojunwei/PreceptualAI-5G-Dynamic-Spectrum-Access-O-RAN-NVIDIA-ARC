name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image ref (GHCR, lowercase)
        id: img
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/horizon-ric" >> "$GITHUB_OUTPUT"

      # Only log in / push on non-PR events (main + tags). PRs build-and-load
      # locally for the smoke check and never publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: ${{ steps.img.outputs.ref }}:${{ steps.ver.outputs.version }}
          # Push to the registry on non-PR events so the following sign/SBOM
          # steps can resolve the image by digest; just load on PRs.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign image (keyless, by digest)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            "${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}"

      - name: Generate + attach SBOM
        if: github.event_name != 'pull_request'
        run: |
          pip install cyclonedx-bom==7.3.0
          cyclonedx-py environment --sv 1.5 --of JSON \
            --output-file deploy/sbom/horizon-ric-sbom.json \
            --pyproject pyproject.toml
          cosign attach sbom --type cyclonedx \
            --sbom deploy/sbom/horizon-ric-sbom.json \
            "${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}"
