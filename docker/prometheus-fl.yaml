# Prometheus configuration for PreceptualAI Federated Learning monitoring.
#
# Scrapes metrics from the aggregation server and all edge devices.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "preceptualai-fl-aggregator"
    static_configs:
      - targets: ["aggregator:8080"]
        labels:
          role: "aggregator"

  - job_name: "preceptualai-fl-edge-devices"
    static_configs:
      - targets:
          - "edge-device-1:8080"
          - "edge-device-2:8080"
          - "edge-device-3:8080"
        labels:
          role: "edge_device"
